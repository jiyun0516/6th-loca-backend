spring.application.name=6th-loca-backend

# ===== Supabase PostgreSQL (project: roca / ebwmydapihczfcytteie) =====
# The DB password is a secret and is NOT stored here.
# Set it as an environment variable before running: SUPABASE_DB_PASSWORD
spring.datasource.url=jdbc:postgresql://db.ebwmydapihczfcytteie.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# If your network is IPv4-only and the direct host above fails to resolve,
# use the Session Pooler instead (Supabase Dashboard -> Connect -> Session pooler).
# Copy the exact host from the dashboard; example shape:
# spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
# spring.datasource.username=postgres.ebwmydapihczfcytteie

# ===== JPA / Hibernate =====
# validate: verify entity mappings against the existing Supabase schema WITHOUT changing it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
