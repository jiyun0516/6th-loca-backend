server.port=${PORT:8080}
spring.application.name=6th-loca-backend

# ===== Supabase PostgreSQL (project: roca / ebwmydapihczfcytteie) =====
# The DB password is a secret and is NOT stored here.
# Set it as an environment variable before running: SUPABASE_DB_PASSWORD

# --- Session Pooler (IPv4) : use this. The direct host is IPv6-only and won't resolve on most networks. ---
# NOTE: verify the host prefix in Supabase Dashboard -> Connect -> Session pooler.
#       It is assigned per project and may be aws-0 or aws-1.
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.ebwmydapihczfcytteie
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HikariCP =====
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

spring.datasource.hikari.leak-detection-threshold=20000

spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000

# --- Direct connection (IPv6 only) : fallback, most local networks cannot resolve this ---
# spring.datasource.url=jdbc:postgresql://db.ebwmydapihczfcytteie.supabase.co:5432/postgres?sslmode=require
# spring.datasource.username=postgres

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
admin.emails=${ADMIN_EMAILS:}

